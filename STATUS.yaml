# ─── Scope decision (2026-04-23) ─────────────────────────────────────────
#
# The action does ONE thing: build a pkg binary, optionally patch Windows
# PE resources, optionally sign, optionally archive, always checksum.
# Emits file paths via step outputs. That's the whole contract.
#
# Distribution concerns (release attach, Docker, Homebrew, Scoop, SBOM,
# SLSA provenance, workflow artifact upload) are out of scope. Users chain
# dedicated first-party actions against the outputs. See README "After the
# build" and docs/architecture.md §2.

# ─── Shipped ─────────────────────────────────────────────────────────────
# One-line summaries. Sub-chunk detail has moved to commit history + tests.

shipped:
  M-1 spikes: runs.using:node24 verified on hosted runners; strip-types + esbuild pipeline proven.
  M0 scaffold: monorepo, yarn workspaces, .node-version, tsconfig, eslint/prettier.
  M1 core build path: inputs/targets/templates/checksum/pkg-runner/archive/orchestrator; codegen'd action.yml; tiny-app-{cjs,esm} fixtures.
  M2 matrix sub-action: parseTargetList → expandMatrix, native-runner pinning, cross-compile warnings; matrix-plan→fanout e2e job.
  M3 windows metadata: resedit integration; icon/version-info/manifest patching; e2e asserts round-trip via pe-library.
  M4 signing & notarization: macOS codesign + notarytool, Windows signtool, Azure Trusted Signing — all behind ExecFn DI; secret-never-in-argv invariant.

# ─── Architectural hardening (shipped 2026-04-23 on PR #9) ───────────────

recent-hardening:
  - 'E2E workflow pull_request trigger path-filtered so docs-only PRs do not burn CI minutes (S12).'
  - 'VERSION export driven by root package.json via esbuild `define`; runtime fallback reads the file in dev (S1).'
  - '`yamlString` codegen helper throws on embedded control chars — prevents silent action.yml corruption (S2).'
  - 'CI coverage gate at 85% via scripts/check-coverage.ts parsing lcov (S6).'

# ─── Input-surface slim (2026-04-23) ─────────────────────────────────────
# Stop mirroring pkg's CLI. Pkg-specific knobs live in the user's pkg config;
# the action owns only concerns pkg config cannot express (CI-matrix targets,
# pkg install version, archive, checksum, windows-metadata, signing, cache).

input-surface-slim:
  dropped-inputs:
    - mode
    - node-version
    - compress-node
    - fallback-to-source
    - public
    - public-packages
    - options
    - no-bytecode
    - no-dict
    - debug
    - extra-args
  migration: 'Move each value into .pkgrc / pkg.config.{js,cjs,mjs} or the `pkg` field of package.json. `buildPkgArgs` forwards the config path to pkg.'
  breaking: |
    Behaviourally yes — a workflow setting any dropped input gets the
    unknown-input warning and the value is ignored. NOT a release note: none of
    this ever shipped under a tag, so there is no released version to break
    from. The v1.0.0 changelog is cut from the scope-cut commit forward for the
    same reason.
  minimum-pkg-version: |
    @yao-pkg/pkg >= 6.19.0 is required for the full build-flag surface in
    pkg config; >= 6.21.0 adds the preBuild / postBuild / transform build
    hooks. The default `pkg-version` input is pinned to `~6.21.0`.
  build-hooks: |
    Config-only feature (no CLI flags, no action inputs) — pkg reads
    preBuild / postBuild / transform straight from the config the action
    forwards via --config, so the pass-through surface needs no change.
    One constraint is documented rather than enforced: a postBuild hook
    must not move or rename the binary or `pkg-output-map` can no longer
    locate it.
  default-pkg-version-bump: |
    `pkg-version` default moved ~6.19.0 -> ~6.21.0.
    breaking: 'no API change. Pre-1.0 there is no floating tag to move under
      anyone, so this needs no release note — but the trust change below must
      be documented for consumers regardless, and it is, in SECURITY.md.'
    security: |
      6.21 hooks are arbitrary code execution sourced from the config in
      the checked-out tree. A workflow that builds an untrusted ref (fork
      pull_request) now grants that ref command execution in a job that
      may hold signing certs and tokens. No such capability existed at
      6.19. Documented in docs/inputs.md + README; not enforceable from
      the action side.
    pin-vs-floor: |
      `~` keeps patch-only so a pkg minor never lands without an action
      release — deliberate, since the action replicates pkg's output
      naming in `pkg-output-map` and a naming change would break it
      silently. Cost: consumers need an action release for pkg minors.
  upstream-dependency: |
    RESOLVED in @yao-pkg/pkg v6.19.0 (2026-04-24) via yao-pkg/pkg#263 —
    closes yao-pkg/pkg#262. All CLI-only build flags now have config
    equivalents: compress, fallbackToSource, public, publicPackages,
    options, bytecode (inverts --no-bytecode), nativeBuild (inverts
    --no-native-build), noDictionary (renamed from --no-dict), debug,
    signature.

# ─── Removed (2026-04-23) ────────────────────────────────────────────────
# Distribution scope reset. Use dedicated downstream actions instead.

removed:
  M5 release attach + release body templating:
    what: 'attach-to-release, release-{tag,name,body,draft,prerelease}, generate-release-table inputs + ReleaseAttacher + buildReleaseBody + step-summary Release trailer.'
    replacement: 'softprops/action-gh-release against steps.<id>.outputs.artifacts + outputs.checksums.'
  M6.1 SLSA provenance:
    what: 'provenance input + attest-build-provenance wiring in the then-composite action.yml.'
    replacement: 'actions/attest-build-provenance@v4 — one step chained after pkg-action.'
  M6.2 SBOM:
    what: 'sbom input + packages/core/src/sbom.ts (CycloneDX 1.5 + SPDX 2.3).'
    replacement: 'anchore/sbom-action (Syft) against the produced binaries.'
  M6.3 Docker OCI publish:
    what: 'docker-* inputs + packages/core/src/docker.ts (multi-arch buildx + push + manifest list).'
    replacement: 'docker/build-push-action against a hand-authored Dockerfile that COPYs the binary path from steps.<id>.outputs.binaries.'
  M6.4 Homebrew tap PR:
    what: 'homebrew-* inputs + renderHomebrewFormula + Octokit-backed DistributionPublisher.'
    replacement: 'dedicated tap-updater actions (e.g. dawidd6/action-homebrew-bump-formula).'
  M6.5 Scoop manifest PR:
    what: 'scoop-* inputs + renderScoopManifest.'
    replacement: 'dedicated bucket-updater actions.'
  Workflow artifact upload:
    what: 'upload-artifact + artifact-name inputs + @actions/artifact integration.'
    replacement: 'actions/upload-artifact@v4 with path set from steps.<id>.outputs.artifacts.'

# ─── Release blocker found and fixed (2026-07-27) ────────────────────────

composite-removal:
  bug: |
    The top-level action was a composite whose build step said
    `uses: ./packages/build`. Inside a composite, a local `uses:` path
    resolves against the CONSUMER's GITHUB_WORKSPACE, not the action's own
    checkout (actions/runner#1348, still open). Every documented invocation
    — `uses: yao-pkg/pkg-action@v1` — would have failed on its first step
    with "Can't find 'action.yml' … for action './packages/build'".
  why-ci-was-green: |
    All eight e2e jobs used `uses: ./`, which makes GITHUB_WORKSPACE and the
    action directory the same tree, so the wrong-root lookup happened to
    land on the right files. The test setup masked the bug completely.
  fix: |
    /action.yml is now a plain `runs.using: node24` action with
    main=packages/build/dist/index.mjs, post=packages/build/dist/post.mjs.
    packages/build/action.yml is deleted — one action.yml, not two. The
    three composite steps moved into TypeScript:
      - PKG_CACHE_PATH export        → core.exportVariable in main.ts
      - actions/cache@v5 step        → @actions/cache restore in main.ts,
                                       save in post.ts (packages/build/src/pkg-cache-io.ts)
      - npm i -g @yao-pkg/pkg        → installPkg() in core/pkg-runner.ts
    The bash specifier regex became parsePkgVersionSpecifier in inputs.ts.
    Cache keys are byte-identical to the ones the composite's hashFiles()
    produced, so pre-1.0 caches still hit.
  cost: |
    Two runtime deps (@actions/cache, @actions/glob) — the budget is now
    full at 6/6. index.mjs 0.96 MB → 2.5 MB, post.mjs 0.73 MB → 2.2 MB.
    Normal for an action that caches; actions/cache's own bundle is ~2 MB.
  regression-guards:
    - 'e2e `consumer-ref` job — fixture at the workspace root, action under test in `_action-under-test/`, so the action directory is not the workspace root. `uses:` accepts no expressions, so no job can name the commit under test by ref; the subdirectory reproduces the part that matters.'
    - 'e2e `consumer-download` job — `uses: yao-pkg/pkg-action@main`, the real download path. Push-to-main only, so it is a post-merge canary rather than a PR gate.'
    - 'unit test "no step uses an expression in its uses: key" — GitHub rejects such a workflow with no annotation naming the line. Cost one CI round-trip on this very PR.'
    - 'unit test "no published action.yml references a local action" over all three action.yml files.'
    - 'unit test "every published action.yml points at a bundle that exists" + "no action.yml escapes the repository root" (covers the `../packages/…` main paths in matrix/ and windows-metadata/).'
    - 'unit test "the repo publishes no action.yml the tests do not know about" — a new action directory cannot silently skip the checks above.'

