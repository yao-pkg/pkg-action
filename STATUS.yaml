# ─── Release automation (2026-07-27) ─────────────────────────────────────

release-tooling:
  driver: 'release-it ^21 + @release-it/conventional-changelog ^12, config in .release-it.json.'
  trigger: '.github/workflows/release.yml — workflow_dispatch, dry-run defaults to true.'
  why-ci-not-laptop: |
    The release commit carries the dist/ bundles consumers execute. CI is the
    only place they are guaranteed to be built by the Node in .node-version —
    the same one the test matrix ran.
  version-flow: |
    Conventional Commits pick the bump → release-it writes root package.json →
    after:bump runs scripts/sync-workspace-versions.ts (root version into every
    packages/*/package.json), then `yarn gen`, then `yarn build`. Only the root
    version is load-bearing; esbuild inlines it as __PKG_ACTION_VERSION__.
    Intra-workspace deps were repinned 0.0.0 → `*` so the sync never has to
    rewrite ranges and yarn keeps linking locally.
  changelog: |
    CHANGELOG.md is generated, never hand-written — release-it rewrites it on
    every release, so an entry edited by hand comes back duplicated on top of a
    regenerated one. Verified: the plugin's `infile` cannot be unset from the
    CLI (`--no-plugins.….infile` writes to a file literally named "false") and
    a config using `extends` deep-merges the parent's `infile` back in.

    So the pre-1.0 noise is cut at the range instead of in the file:
    `gitRawCommitsOpts.from` pins generation to the scope-cut commit
    (9781c17), which is where the Docker / SBOM / Homebrew / Scoop / provenance
    / release-attach work was removed. Everything before it describes features
    that never shipped and are not in v1.0.0, so listing them would be wrong,
    not merely noisy. test/chore/style types stay hidden.
  open-question: |
    RESOLVED — packages/*/package.json versions are synced by the release
    script rather than left at 0.0.0. They are cosmetic (private:true, never
    published), so this is a consistency choice: no manifest should claim 0.0.0
    inside a tagged release.
  major-tag: 'scripts/move-major-tag.ts runs in after:release, force-moves vN to the new tag. Skipped for prereleases so @v1 never serves an rc.'
  open-question: |
    packages/*/package.json versions are cosmetic — those packages are
    private:true and never published. Syncing them is what was asked for and
    is harmless; leaving them at 0.0.0 forever would also have been defensible.

# ─── Runtime dependencies ────────────────────────────────────────────────
# Every runtime dep must be justified — cap 6 (plan §16). NOW FULL AT 6/6.

runtime-deps:
  '@actions/core':
    version: ^3.0.0
    purpose: runner protocol (inputs, outputs, secrets, annotations, state).
  '@actions/exec':
    version: ^3.0.0
    purpose: process spawning with GH log streaming.
  '@actions/cache':
    version: ^6.2.0
    purpose: |
      pkg-fetch download cache. Added 2026-07-27 when the composite wrapper
      was removed — actions/cache@v5 was a composite step and had nowhere left
      to live. Pulls @azure/storage-blob; ~2.1 MB of the bundle is this.
  '@actions/glob':
    version: ^0.6.1
    purpose: |
      hashFiles() for the default cache key. Same implementation the workflow
      expression used, so keys are unchanged across the migration.
  resedit:
    version: ^3.0.2
    purpose: Windows PE resource editing (pulls pe-library@^2.0.1 transitively).
  yazl:
    version: ^3.3.1
    purpose: cross-platform deterministic zip writer.

dev-deps:
  release-it:
    version: ^21.0.0
    notes: 'release driver. Engines require Node ^22.21.0 || >=24 — satisfied by .node-version (22.22.1) and the CI matrix.'
  '@release-it/conventional-changelog': { version: ^12.0.0 }
  typescript:
    version: 5.9.3
    notes: pinned — must stay compatible with Node 22.22.1 bundled amaro strip-types parser.
  esbuild: { version: ^0.28.0 }
  eslint:
    version: ^9.39.4
    notes: holding at v9.x until flat-config verified on v10.
  '@typescript-eslint/eslint-plugin': { version: ^8.58.2 }
  '@typescript-eslint/parser': { version: ^8.58.2 }
  eslint-config-prettier: { version: ^10.1.8 }
  eslint-plugin-prettier: { version: ^5.5.5 }
  prettier: { version: ^3.8.3 }
  globals: { version: ^17.5.0 }
  '@types/node':
    version: ^22.19.17
    notes: pinned to @22 to match runtime — NOT @25 (would surface APIs we cannot use).
  '@types/yazl': { version: ^3.3.1 }

